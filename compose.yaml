services:
  app:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  app-production:
    profiles: ["production"]
    build:
      context: .
      target: production
    ports:
      - "3000:3000"

volumes:
  node_modules:
